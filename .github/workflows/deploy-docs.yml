name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "overrides/**"
      - "requirements-docs.txt"
      - ".github/workflows/deploy-docs.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "overrides/**"
      - "requirements-docs.txt"

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Lint — Check Markdown formatting and links
  # ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Create markdownlint config
        run: |
          cat > .markdownlint.json << 'EOF'
          {
            "MD013": false,
            "MD033": false,
            "MD041": false,
            "MD024": { "siblings_only": true },
            "MD046": false
          }
          EOF

      - name: Lint Markdown files
        run: markdownlint 'docs/**/*.md' --ignore 'docs/stylesheets' --ignore 'docs/javascripts'

  # ─────────────────────────────────────────────────────────────────────
  # Build — Verify the docs build successfully
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - name: Build documentation (strict mode)
        run: mkdocs build --strict

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Deploy — Push built site to GitHub Pages
  # Only runs on push to main (not on PRs)
  # ─────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site/

      - name: Deploy to GitHub Pages repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          # Use a Personal Access Token with repo scope for cross-repo deployment
          # Create the token at: GitHub → Settings → Developer Settings → Personal Access Tokens
          # Add it as a secret named DEPLOY_TOKEN in the kubeadm-automation repo settings
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: Ruhanyat-994/ruhanyat-994.github.io
          publish_branch: main
          publish_dir: ./site
          destination_dir: projects/kubeauto/docs
          keep_files: true
          commit_message: "docs: deploy KubeAuto documentation (${{ github.sha }})"
